<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content="noindex"><title>1811 Quebec Quotes</title>
<style>
:root{--bg:#F2F2F2;--tile:#FFFFFF;--ink:#16233F;--mut:#6B6B6B;--line:#E8E8E8;--num:#16233F;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000000;--tile:#111111;--ink:#FFFFFF;--mut:#8A8A8A;--line:#232323;--num:#EE7325;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--tile:#111111;--ink:#FFFFFF;--mut:#8A8A8A;--line:#232323;--num:#EE7325;color-scheme:dark}
:root[data-theme="light"]{--bg:#F2F2F2;--tile:#FFFFFF;--ink:#16233F;--mut:#6B6B6B;--line:#E8E8E8;--num:#16233F;color-scheme:light}
*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,'SF Pro Text','Inter',system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:22px 16px 56px}
.k{font:700 10.5px/1.3 -apple-system,'Inter',sans-serif;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.head{background:#EE7325;color:#fff;border-radius:20px;padding:20px 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
h1{font:700 26px/1.1 -apple-system,'SF Pro Display','Inter',sans-serif;margin:6px 0 0}
.head .k{color:rgba(255,255,255,.85)}.seg{display:inline-flex;background:rgba(0,0,0,.18);border-radius:999px;padding:3px}.seg button{border:0;background:transparent;color:#fff;font:600 13px -apple-system,'Inter',sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer}.seg button.on{background:#fff;color:#16233F}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.tile{background:var(--tile);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile.pick{background:#EE7325;color:#fff}.tile.pick .k,.tile.pick .d,.tile.pick .br,.tile.pick .m{color:rgba(255,255,255,.88)}.tile.pick .amt{color:#fff}.tile.pick .go a{background:#fff;color:#16233F}
.tile h3{margin:2px 0 0;font:700 18px/1.2 -apple-system,'SF Pro Display','Inter',sans-serif}.d{color:var(--mut);font-size:13.5px;flex:1}
.amt{font:700 44px/1 -apple-system,'SF Pro Display','Inter',sans-serif;letter-spacing:-.04em;color:var(--num);margin:12px 0 4px}
.br{font-size:13px;color:var(--mut);line-height:1.6}.br b{color:inherit;font-weight:600}.m{font-size:12.5px;color:var(--mut)}.adj{font-size:12.5px;font-weight:600}
.go{margin-top:10px}.go a{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px}
.note{background:var(--tile);border-radius:20px;padding:14px 22px 14px 38px;margin-top:12px;color:var(--mut);font-size:13.5px}.note li{margin:4px 0}
@media (max-width:760px){.grid{grid-template-columns:1fr}.amt{font-size:40px}}
</style></head><body><main>
<div class="head"><div><div class="k">Velocity Contracting · Repair quote options</div><h1>1811 S Quebec Way #169</h1></div>
<div class="ctl"><div class="seg" id="mode"><button data-m="1">No permits</button><button data-m="2">With permits</button></div><div class="seg" id="thm"><button data-t="light">Light</button><button data-t="dark">Dark</button></div></div></div>
<div class="grid" id="cards"></div><ul class="note" id="note"></ul></main>
<script>
const D = {"1": {"A": {"total": 15666, "parts": {"item": 15126, "license": 0, "permit": 0, "elective": 0, "sewer": 540}, "name": "Full flooring replacement", "desc": "Inspection repairs with full carpet and LVP replacement", "sub": 13055}, "B": {"total": 9546, "parts": {"item": 9006, "license": 0, "permit": 0, "elective": 0, "sewer": 540}, "name": "Flooring patches and carpet cleaning", "desc": "Inspection repairs with the damaged flooring patched and the carpet cleaned", "sub": 7955}, "C": {"total": 24876, "parts": {"item": 15126, "license": 0, "permit": 0, "elective": 9210, "sewer": 540}, "name": "Full flooring replacement plus elective items", "desc": "Option A plus the elective items requested beyond the inspection", "sub": 20730}}, "2": {"A": {"total": 17547, "parts": {"item": 16314, "license": 0, "permit": 693, "elective": 0, "sewer": 540}, "name": "Full flooring replacement", "desc": "Inspection repairs with full carpet and LVP replacement", "sub": 14580}, "B": {"total": 11427, "parts": {"item": 10194, "license": 0, "permit": 693, "elective": 0, "sewer": 540}, "name": "Flooring patches and carpet cleaning", "desc": "Inspection repairs with the damaged flooring patched and the carpet cleaned", "sub": 9480}, "C": {"total": 27057, "parts": {"item": 16314, "license": 642, "permit": 51, "elective": 9510, "sewer": 540}, "name": "Full flooring replacement plus elective items", "desc": "Option A plus the elective items requested beyond the inspection", "sub": 22505}}}, NOTE = {"1": ["No permits: the handyman does the two valves, no licensed sign-off, no permit lines.", "Every quote includes the sewer descale and rescope."], "2": ["With permits: a licensed plumber on the valves with the Denver plumbing permit, the electrician's licensed sign-off and permit, the heating and cooling trade's permit inside its prices.", "Every quote includes the sewer descale and rescope."]}, MASTER = true, BASE = "/quotes/w-8d37883a3f/options/";
const $ = n => "$" + Number(n).toLocaleString("en-US");
let mode = new URLSearchParams(location.search).get("mode") === "2" ? "2" : "1";
function applyTheme(t){ if(t) document.documentElement.dataset.theme = t; }
try{ applyTheme(localStorage.getItem("q169theme")); }catch(_){ }
function adjusted(m, v){ try{ const s = JSON.parse(localStorage.getItem("q169off:" + BASE + "p" + m + "/" + v.toLowerCase() + "/") || "null"); return s && s.off && s.off.length ? s : null; }catch(_){ return null; } }
function render(){
 const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
 document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.m === mode));
 document.querySelectorAll("#thm button").forEach(b => b.classList.toggle("on", b.dataset.t === (dark ? "dark" : "light")));
 const other = mode === "1" ? "2" : "1";
 document.getElementById("cards").innerHTML = ["A", "B", "C"].map((v, i) => { const q = D[mode][v], o = D[other][v], p = q.parts, diff = q.total - o.total, adj = adjusted(mode, v);
  const lines = [["Inspection items and sewer scope", p.item + (p.sewer || 0)], ["Permits, inspections and licensed sign-off", p.permit + p.license], ["Elective items", p.elective]].filter(x => x[1]);
  return `<div class="tile"><div class="k">Option ${v} · ${mode === "1" ? "No permits" : "With permits"}</div><h3>${q.name}</h3><div class="d">${q.desc}</div>
   <div class="amt">${$(q.total)}</div>${adj ? `<div class="adj">${$(adj.total)} with ${adj.off.length} line${adj.off.length > 1 ? "s" : ""} switched off</div>` : ""}
   <div class="br">${lines.map(x => `${x[0]} <b>${$(x[1])}</b>`).join("<br>")}</div>
   <div class="m">${MASTER ? "Sub cost " + $(q.sub) + " · margin " + $(Math.round(q.sub * 0.2)) + " · " : ""}${diff >= 0 ? "+" : "-"}${$(Math.abs(diff))} vs ${other === "1" ? "no permits" : "with permits"}</div>
   <div class="go"><a href="${BASE}p${mode}/${v.toLowerCase()}/">Open quote ${v}</a></div></div>`; }).join("");
 document.getElementById("note").innerHTML = NOTE[mode].map(x => `<li>${x}</li>`).join("") + (MASTER ? "<li>Margin is 20 pct of sub cost on every line.</li>" : "");
 history.replaceState(null, "", "?mode=" + mode);
}
document.getElementById("mode").addEventListener("click", e => { if(e.target.dataset.m){ mode = e.target.dataset.m; render(); } });
document.getElementById("thm").addEventListener("click", e => { const t = e.target.dataset.t; if(!t) return; applyTheme(t); try{ localStorage.setItem("q169theme", t); }catch(_){ } render(); });
render();
</script></body></html>
