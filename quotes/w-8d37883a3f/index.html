<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>1811 Quebec Walk List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky totals and filter rail over a single column of finding cards; a sheet slides up with the report evidence */
:root{
  --bg:#F3F2EE; --card:#FFFFFF; --ink:#1C2321; --mut:#5E6863; --line:#DAD8D1;
  --accent:#1F5F5B; --accent-ink:#FFFFFF; --chip:#E7E6E0;
  --red:#C62828; --orange:#E07A12; --blue:#3E7CB1; --ok:#2E7D4F;
  --disp:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Public Sans',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --card:#1D2421; --ink:#E9ECEA; --mut:#9AA5A0; --line:#2F3834; --accent:#5FB3AA; --accent-ink:#0E1412; --chip:#28302D;
  --red:#EF5350; --orange:#F0A04B; --blue:#7FB0DB; --ok:#5CC08A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --card:#1D2421; --ink:#E9ECEA; --mut:#9AA5A0; --line:#2F3834; --accent:#5FB3AA; --accent-ink:#0E1412; --chip:#28302D;
  --red:#EF5350; --orange:#F0A04B; --blue:#7FB0DB; --ok:#5CC08A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px 8px}
.ttl{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:700 26px/1.05 var(--disp);letter-spacing:.01em;margin:0;text-wrap:balance}
.addr{color:var(--mut);font-size:13px}
.tot{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--mut)}
.tot b{font:500 15px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.rail{display:flex;gap:6px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chipb{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font:600 13px var(--body);cursor:pointer;white-space:nowrap}
.chipb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chipb .n{font:500 12px var(--mono);opacity:.75;margin-left:4px}
.row2{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.row2 input[type=search]{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--mut);padding:7px 10px;font:600 12px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--ink)}
.grp{font:700 18px var(--disp);letter-spacing:.04em;text-transform:uppercase;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grp small{font:500 13px var(--mono);color:var(--mut);text-transform:none;letter-spacing:0}
.f{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 16px;margin-bottom:10px;position:relative;display:grid;gap:8px}
.f::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:5px;border-radius:0 4px 4px 0;background:var(--blue)}
.f.high::before{background:var(--red)} .f.med::before{background:var(--orange)}
.fh{display:flex;gap:10px;align-items:flex-start}
.ref{font:500 12px var(--mono);color:var(--mut);white-space:nowrap;padding-top:3px}
.ft{font:600 15px/1.3 var(--body);min-width:0}
.ft .loc{display:block;font-weight:400;color:var(--mut);font-size:13px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font:600 11px var(--body);letter-spacing:.03em;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--mut)}
.tag.sev-high{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.tag.sev-med{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.tag.sev-low{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.note{font-size:13px;color:var(--mut);border-left:3px solid var(--line);padding-left:8px}
.thumbs{display:flex;gap:6px;overflow-x:auto}
.thumbs img{width:84px;height:64px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:zoom-in;flex:0 0 auto}
.price{display:grid;grid-template-columns:120px 1fr;gap:6px}
.price input,.price textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 9px;font:inherit;font-size:14px}
.price .amt{font-family:var(--mono)}
.price textarea{grid-column:1/-1;min-height:38px;resize:vertical}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:6px 10px;font:600 13px var(--body);cursor:pointer}
.btn.solid{background:var(--accent);color:var(--accent-ink)}
.saved{font-size:12px;color:var(--ok)}
.priced .amt{border-color:var(--ok)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);z-index:41;border-radius:16px 16px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:860px;margin:0 auto}
.sheet h2{font:700 22px/1.1 var(--disp);margin:4px 0}
.sheet .sub{color:var(--mut);font-size:13px}
.sheet .ev{display:block;width:100%;max-width:520px;border-radius:10px;border:1px solid var(--line);margin:10px 0}
.sheet p{margin:6px 0;max-width:65ch}
.sheet .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.sheet .gal img{width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.shbar{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-14px;background:var(--card);padding-block:6px;z-index:1}
.lbl{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:12px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.zoom img{max-width:100%;max-height:100%;border-radius:6px}
.el{border-style:dashed}
.el .ft input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 8px;font:600 15px var(--body)}
.el select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
.status{font-size:12px;color:var(--mut)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.qline{margin:8px 0 2px;padding:8px 10px;border-radius:8px;background:var(--soft,#F3F4F6);font-size:13.5px;line-height:1.4}.qline b{font-family:var(--mono,monospace)}.qline .alt{color:var(--mut,#6B7280)}.qline .flag{display:block;color:#B45309;font-size:12.5px;margin-top:3px}.qline.pend{color:var(--mut,#6B7280)}.qsum{margin:8px 0 0;font-size:13.5px}.qsum a{font-weight:600}</style>

<div class="wrap">
<header class="top">
  <div class="ttl"><h1>1811 S Quebec Way #169</h1><span class="addr">Walkthrough list, Alpine inspection 9/30</span></div>
  <div class="tot" id="tot"></div>
  <div class="rail" id="crafts" role="group" aria-label="Filter by craft"></div>

      <button data-v="all" aria-pressed="true">All</button><button data-v="high">Safety</button><button data-v="med">Moderate</button><button data-v="low">Maint.</button>

</header>
<main id="list"></main>

<script>
const F = [{"ref": "3.1.1", "section": "General", "title": "Limitation - Drone Inspection", "loc": "", "desc": ["The roof was inspected using a drone, which provides a general overview but has inherent limitations compared to a physical inspection. While the drone allows for visual observation of roof surfaces, it may not detect all potential issues, such as underlying damage or detailed wear. We recommend a comprehensive assessment by a qualified roofing professional to ensure a more thorough evaluation of the roof's condition."], "pro": "Roofing Professional", "sev": "low", "photos": ["3.1.1_1.jpg"], "anchor": "obs-46114773-506a-5207-b771-112c80d7650a", "ev": "ev/3.1.1.jpg", "craft": "hoa", "also": [], "note": "HOA covers roof damage with its own roofer (HOA call 10/2). Seller reports it with these photos."}, {"ref": "3.5.1", "section": "Coverings", "title": "Coverings - Tree Overhang", "loc": "", "desc": ["Trees observed overhanging the roof. This can cause damage to the roof and prevent proper drainage. Recommend a qualified tree service trim to allow for proper drainage."], "pro": "Tree Service", "sev": "low", "photos": ["3.5.1_1.jpg", "3.5.1_2.jpg"], "anchor": "obs-578cd198-003c-560b-9edd-fd538b8b0985", "ev": "ev/3.5.1.jpg", "craft": "hoa", "also": [], "note": "HOA handles trees and landscaping (HOA call 10/2)."}, {"ref": "3.5.2", "section": "Coverings", "title": "Coverings - Moderate Damage/Deterioration", "loc": "", "desc": ["Moderate damage and deterioration of the roof covering surface was noted, either from mechanical damage, weather related events, or moderate wear. These areas could be allowing moisture penetration and could lead to further damage, as the damage will shorten the lifespan of the roof covering. Recommend further evaluation by a qualified professional."], "pro": "Roofing Professional", "sev": "med", "photos": ["3.5.2_1.jpg"], "anchor": "obs-146058ec-4c9d-547d-a532-33cd2da7439f", "ev": "ev/3.5.2.jpg", "craft": "hoa", "also": [], "note": "HOA covers roof damage with its own roofer (HOA call 10/2)."}, {"ref": "4.2.1", "section": "Walkways, Patios & Driveways", "title": "Flatwork - Settling And/Or Heaving", "loc": "Exterior East", "desc": ["Areas of flatwork were not level and/or were cracking through slabs or at control joints. This condition appeared to be the result of settling or heaving of soil beneath the surface. This condition also generally creates a trip hazard due to uneven heights of walking surfaces. This is not uncommon in areas of expansive soils, or where grading and drainage is not properly managed. Recommend sealing gaps and cracks to prevent further settling. Repairs or replacement are an option as well if desired."], "pro": "Concrete Contractor", "sev": "med", "photos": ["4.2.1_1.jpg"], "anchor": "obs-15eb0831-001b-5b5b-a82f-64e2f81404d7", "ev": "ev/4.2.1.jpg", "craft": "hoa", "also": [], "note": "Exterior flatwork, likely HOA; confirm in the HOA docs."}, {"ref": "4.2.2", "section": "Walkways, Patios & Driveways", "title": "Flatwork - Concrete Scaling/Spalling", "loc": "Exterior East", "desc": ["Scaling/spalling was visible on surfaces of concrete flatwork. Scaling or spalling is surface deterioration in which flakes of concrete detach from the surface. The Inspector recommends patching with an appropriate material to help prevent continued deterioration."], "pro": "Concrete Contractor", "sev": "low", "photos": ["4.2.2_1.jpg"], "anchor": "obs-8fae92bc-b90d-5876-a7ce-98519e397f80", "ev": "ev/4.2.2.jpg", "craft": "hoa", "also": [], "note": "Exterior flatwork, likely HOA; confirm in the HOA docs."}, {"ref": "4.3.1", "section": "Siding, Flashing & Trim", "title": "Caulking, Touchup Paint And/Or Minor Repair Needed", "loc": "Various Locations Throughout Exterior", "desc": ["Exterior siding/trim is in need of minor repair, caulking, and/or touch-up paint. It is common for materials to deteriorate over time, but proper protecting of exterior surfaces will ensure longevity and durability of materials. Recommend repair."], "pro": "Painting Contractor", "sev": "low", "photos": ["4.3.1_1.jpg", "4.3.1_2.jpg", "4.3.1_3.jpg"], "anchor": "obs-92c23060-a795-5b4e-85ea-8db7c629117b", "ev": "ev/4.3.1.jpg", "craft": "hoa", "also": [], "note": "Exterior damage is HOA per the 10/2 call; confirm in the HOA docs."}, {"ref": "4.3.2", "section": "Siding, Flashing & Trim", "title": "Over-Driven/Protruding Nails", "loc": "Various Locations Throughout Exterior", "desc": ["Various nails were either over-driven or were protruding. This could be due to poor installation, but is commonly due to swollen siding as it works nails loose over time. Recommend installing nails and sealing any opening that could lead to moisture intrusion/damage."], "pro": "Qualified Professional", "sev": "low", "photos": ["4.3.2_1.jpg", "4.3.2_2.jpg", "4.3.2_3.jpg"], "anchor": "obs-ce397ced-21ab-528f-bcea-c649dd8e857b", "ev": "ev/4.3.2.jpg", "craft": "hoa", "also": [], "note": "Exterior damage is HOA per the 10/2 call; confirm in the HOA docs."}, {"ref": "4.5.1", "section": "Exterior Doors", "title": "Weatherstripping - Damaged/Missing/Improperly Installed", "loc": "West, East Entry", "desc": ["Door has missing, damaged or improperly installed weather stripping. This can result in significant energy loss and moisture intrusion. Recommend installation of standard weatherstripping.", "Here is a DIY guide on weatherstripping."], "pro": "Door Installation Contractor", "sev": "low", "photos": ["4.5.1_1.jpg", "4.5.1_2.jpg"], "anchor": "obs-8823cf0b-6339-5fc7-9921-ec3123429e20", "ev": "ev/4.5.1.jpg", "craft": "finish", "also": [], "note": ""}, {"ref": "4.5.2", "section": "Exterior Doors", "title": "Door Knobs/Locks/Latches - Damaged, Malfunctioning Or Missing", "loc": "Deck Closet", "desc": ["Door knobs or locks were damaged, malfunctioning, or missing. This may include (but is not limited to):", "Locks not fully latching", "Locks installed backwards (knob/handle must be turned to close)", "Loose, damaged or missing knobs/handles/locks", "Jammed knobs/handles or latches", "To restore full functionality, recommend further evaluation by a qualified professional."], "pro": "Door Installation Contractor", "sev": "low", "photos": ["4.5.2_1.jpg"], "anchor": "obs-bfa2b046-6fff-5d1f-8b16-148add642bfc", "ev": "ev/4.5.2.jpg", "craft": "finish", "also": [], "note": ""}, {"ref": "4.5.3", "section": "Exterior Doors", "title": "Screen (Sliding/Storm Door) - Damaged, Old Or Missing", "loc": "West Entry", "desc": ["One or more screen doors or a screened section of a door was observed to be damaged, was old, or was missing entirely. Repair or replacement of the screening is recommended to ensure proper functionality of the screen. Recommend further evaluation by a qualified professional."], "pro": "Handyman", "sev": "low", "photos": ["4.5.3_1.jpg"], "anchor": "obs-a214a58b-6fda-5585-aed0-27944da443e4", "ev": "ev/4.5.3.jpg", "craft": "finish", "also": [], "note": ""}, {"ref": "4.7.1", "section": "Decks, Porches, and Balconies", "title": "Risers - Too Tall", "loc": "Exterior West", "desc": ["Risers exceeded 7 3/4 inches (19.6cm) in height. Although this condition is now considered a potential trip/fall hazard, it is not uncommon in older homes such as this one, built during a time period during which safety standards were different from generally-accepted current safety standards. Current standards mandate a minimum height of 4 inches minimum and maximum height of 7 3/4 inches. Recommend evaluation by a qualified professional."], "pro": "Carpentry Contractor", "sev": "med", "photos": ["4.7.1_1.jpg", "4.7.1_2.jpg"], "anchor": "obs-ccb7ddd4-af36-5f6a-88a6-bf3669103617", "ev": "ev/4.7.1.jpg", "craft": "finish", "also": ["hoa"], "note": "Deck stairs: may be HOA, confirm in the HOA docs."}, {"ref": "4.8.1", "section": "Vegetation, Grading, & Site Drainage", "title": "Neutral Or Negative Grading", "loc": "Exterior North", "desc": ["The home had areas of neutral or negative drainage that will route runoff from precipitation toward the foundation or other vulnerable areas around the exterior of the home. Because the home was in an area that may contain expansive soil, the Inspector recommends re-grading these areas to improve drainage near the foundation and help reduce the risk of foundation damage. The ground should slope away from the home a minimum of  1/4-inch per foot for a distance of at least six feet from the foundation."], "pro": "Landscaping Contractor", "sev": "med", "photos": ["4.8.1_1.jpg", "4.8.1_2.jpg"], "anchor": "obs-cb4a8fd1-f9b4-560c-89b5-b4f0a4feaa54", "ev": "ev/4.8.1.jpg", "craft": "hoa", "also": [], "note": "HOA handles grading that sends water to the foundation (HOA call 10/2)."}, {"ref": "4.9.1", "section": "Exterior Faucets", "title": "High Water Pressure - Adjust Or Install Water Pressure Regulator", "loc": "", "desc": ["The water pressure was high (see photo for PSI reading). High water pressure can cause damage to fittings, appliances, and water pipes. A pressure reducing valve at the main water supply line can regulate and adjust the pressure down to an operating pressure between 40-80 psi. Recommend evaluation by a licensed plumber."], "pro": "Plumbing Contractor", "sev": "med", "photos": ["4.9.1_1.jpg"], "anchor": "obs-1f35077a-da7b-5fca-81cf-b30b2918c6a8", "ev": "ev/4.9.1.jpg", "craft": "plumb", "also": [], "note": ""}, {"ref": "4.13.1", "section": "Window Wells", "title": "Minor/Moderate Rust", "loc": "Exterior East", "desc": ["The metal window well or cover showed areas of minor to moderate surface rusting. Over time, rust will continue to spread and can lead to failure of the window well. Recommend evaluation by a qualified professional."], "pro": "Window Well Services", "sev": "low", "photos": ["4.13.1_1.jpg"], "anchor": "obs-f6dd5b91-2cdc-57fc-b344-0b6b6a3842ca", "ev": "ev/4.13.1.jpg", "craft": "hoa", "also": [], "note": "Exterior, likely HOA; confirm in the HOA docs."}, {"ref": "5.5.1", "section": "Lighting Fixtures, Switches & Receptacles", "title": "Loose Receptacle", "loc": "West Bedroom", "desc": ["A receptacle and/or switch was loose and not fully secured within the electric box. This is a simple fix. Aside from being inconvenient, this can be unsafe and can also lead to wires becoming loose over time. Recommend repair by a licensed electrician."], "pro": "Electrical Contractor", "sev": "med", "photos": ["5.5.1_1.jpg"], "anchor": "obs-a517f0eb-27dc-5d0b-a949-4b7760010fff", "ev": "ev/5.5.1.jpg", "craft": "elec", "also": [], "note": ""}, {"ref": "5.5.2", "section": "Lighting Fixtures, Switches & Receptacles", "title": "Cover Plates Missing (1 more defect)", "loc": "East Bedroom, Sump Pump, Attic", "desc": ["At the time of the inspection, an electrical receptacle or switch cover plate was missing or badly damaged. This condition left energized electrical components exposed to touch, a shock/electrocution hazard. The Inspector recommends a cover plate be installed by a qualified electrical contractor."], "pro": "Electrical Contractor", "sev": "high", "photos": ["5.5.2_1.jpg", "5.5.2_2.jpg", "5.5.2_3.jpg"], "anchor": "obs-c0dd7bad-4537-5f4d-bd11-e1d20571d8c8", "ev": "ev/5.5.2.jpg", "craft": "elec", "also": [], "note": ""}, {"ref": "5.6.1", "section": "GFCI & AFCI Protection", "title": "No GFCI Protection Installed", "loc": "Kitchen, Laundry", "desc": ["No ground fault circuit interrupter (GFCI) protection was provided at one or more locations at the time of inspection. Although GFCI protection may not have been required in this location at the time the home was built, the Inspector recommends that electrical receptacles located in common wet locations be provided with ground fault circuit interrupter (GFCI) protection in good working order to avoid potential electric shock or electrocution hazards. Recommend evaluation and repair by a licensed electrician."], "pro": "Electrical Contractor", "sev": "high", "photos": ["5.6.1_1.jpg", "5.6.1_2.jpg"], "anchor": "obs-a95065d2-17fb-5fe9-9c4b-a213c7d032a9", "ev": "ev/5.6.1.jpg", "craft": "elec", "also": [], "note": ""}, {"ref": "7.1.1", "section": "General", "title": "Maintenance Note: Water Heating Systems", "loc": "", "desc": ["Water heating equipment cleaning, service, and certification should be annually performed by a qualified plumber as part of a home maintenance plan. Equipment types include water heater tanks, tankless water heaters, and boiler-supported sidearm tanks. This maintenance will ensure proper function and efficiency while helping to prolong equipment life and alert occupants to any issues that may not be perceived by occupants during regular use. Recommend that all present water heating equipment be serviced within the first year of homeownership unless sellers have provided recent proof of maintenance."], "pro": "Plumbing Contractor", "sev": "low", "photos": ["7.1.1_1.jpg"], "anchor": "obs-66c9bb67-01ec-5f20-8db7-b2aef9dafddf", "ev": "ev/7.1.1.jpg", "craft": "info", "also": [], "note": "Maintenance note, no repair asked."}, {"ref": "7.2.1", "section": "Main Water Shut-off Device", "title": "Outdated Valve", "loc": "Basement East", "desc": ["The main water shutoff valve is outdated. Gate valves can fail due to wear and corrosion, and they can get stuck in the open, closed, or partially open position. While the valve may be fully functional, it's recommended as best practice to replace critical shutoff valves with modern ball valves. Recommend repair/replacement by a qualified plumber."], "pro": "Plumbing Contractor", "sev": "low", "photos": ["7.2.1_1.jpg"], "anchor": "obs-615044ab-2adf-5f00-aa63-34d6e43e6d0f", "ev": "ev/7.2.1.jpg", "craft": "plumb", "also": [], "note": ""}, {"ref": "7.4.1", "section": "Drain, Waste, & Vent Systems", "title": "Slow Draining Drain", "loc": "Basement Bathroom", "desc": ["A plumbing drain was slowly draining at the time of inspection, likely due to a restricted drain line. Recommend a qualified plumber repair."], "pro": "Plumbing Contractor", "sev": "low", "photos": ["7.4.1_1.jpg"], "anchor": "obs-a9e2c0d0-a402-5f76-9364-897680a38442", "ev": "ev/7.4.1.jpg", "craft": "plumb", "also": [], "note": "HOA says the sewer line from the unit to the main is the owner’s: ask the plumber to camera-scope it."}, {"ref": "7.5.1", "section": "Plumbing Fixtures", "title": "Toilet - Loose At Floor", "loc": "East Bedroom Bathroom", "desc": ["The toilet was loose at the floor and should be re-attached by a qualified plumbing contractor. Recommend repair to avoid leakage at the base of the toilet."], "pro": "Plumbing Contractor", "sev": "med", "photos": ["7.5.1_1.jpg"], "anchor": "obs-f626061a-307c-551c-b31c-ffc01389a81c", "ev": "ev/7.5.1.jpg", "craft": "plumb", "also": [], "note": ""}, {"ref": "7.5.2", "section": "Plumbing Fixtures", "title": "Shower - Leaking Shower Head", "loc": "Throughout 2Nd Floor Bathrooms", "desc": ["A shower head was leaking around a connection upon operation. The leaking shower head is usually a matter of replacing washers and o-rings. If left uncorrected for long periods of time, the corrosion will eventually damage the shower head and/or lead to moisture intrusion behind the shower surround. Recommend repair."], "pro": "Plumbing Contractor", "sev": "med", "photos": ["7.5.2_1.jpg", "7.5.2_2.jpg"], "anchor": "obs-5ce8337b-121a-517b-b4f7-da5ee7c73337", "ev": "ev/7.5.2.jpg", "craft": "plumb", "also": [], "note": ""}, {"ref": "7.5.3", "section": "Plumbing Fixtures", "title": "Diverter - Tub Shower Diverter Does Not Fully Engage", "loc": "West Bedroom Bathroom", "desc": ["The bathtub/shower diverter valve did not fully engage or did not engage at all, therefore preventing a full diversion of water flow to the shower head. Recommend repair or replacement as needed."], "pro": "Plumbing Contractor", "sev": "low", "photos": ["7.5.3_1.jpg"], "anchor": "obs-bedc02d5-9c05-5f8d-b249-19c21e761352", "ev": "ev/7.5.3.jpg", "craft": "plumb", "also": [], "note": ""}, {"ref": "7.7.1", "section": "Combustion Air, Vents & Flues", "title": "Combustion Air - Dedicated Source Not Identified", "loc": "Mechanical Room", "desc": ["The combustion appliance zone (CAZ) did not have a clearly identified dedicated combustion air source. This can lead to insufficient air supply for proper combustion, increasing the risk of backdrafting, incomplete combustion, and the accumulation of carbon monoxide. Combustion appliances require 50 cubic feet per 1000 BTU per hour (BTU/h) aggregate input.", "Consult a licensed HVAC contractor to evaluate and install a dedicated combustion air source in compliance with applicable codes and standards to ensure safe and efficient operation of the combustion appliances."], "pro": "HVAC Professional", "sev": "med", "photos": ["7.7.1_1.jpg"], "anchor": "obs-b153652c-9fc6-501f-900f-75c06a3afeff", "ev": "ev/7.7.1.jpg", "craft": "hvac", "also": [], "note": ""}, {"ref": "7.8.1", "section": "Fuel Storage & Distribution Systems", "title": "Outdated Gas Valve", "loc": "Furnace", "desc": ["Outdated gas shutoff valves were observed. These valves can be difficult to operate, prone to leaks, or fail during emergencies. Recommend a qualified plumbing contractor evaluate and update with a modern ball valve."], "pro": "Plumbing Contractor", "sev": "med", "photos": ["7.8.1_1.jpg"], "anchor": "obs-ab155300-c213-5359-ab96-c97303c499c5", "ev": "ev/7.8.1.jpg", "craft": "plumb", "also": ["hvac"], "note": "Licensed gas work; plumber or HVAC."}, {"ref": "8.1.1", "section": "General", "title": "Maintenance Note: HVAC Equipment", "loc": "", "desc": ["HVAC equipment cleaning, service, and certification should be annually performed by a qualified HVAC contractor on all HVAC types (AC condensers/coils, furnaces, boilers, mini-splits, evaporative coolers, etc.) as part of a home maintenance plan. Seasonal maintenance (depending upon equipment type) by a qualified HVAC professional will ensure proper function and efficiency while helping to prolong equipment life and alert occupants to any issues that may not be perceived by occupants during regular use. Recommend that all present HVAC equipment be serviced within the first year of homeownership unless sellers have provided recent proof of maintenance."], "pro": "HVAC Professional", "sev": "low", "photos": ["8.1.1_1.jpg"], "anchor": "obs-b9b45ab2-a5b8-590e-bb7b-367b248a3ac1", "ev": "ev/8.1.1.jpg", "craft": "hvac", "also": [], "note": ""}, {"ref": "8.6.1", "section": "Combustion Air, Vents & Flues", "title": "Combustion Air - Dedicated Source Not Identified", "loc": "Mechanical Room", "desc": ["The combustion appliance zone (CAZ) did not have a clearly identified dedicated combustion air source. This can lead to insufficient air supply for proper combustion, increasing the risk of backdrafting, incomplete combustion, and the accumulation of carbon monoxide. Combustion appliances require 50 cubic feet per 1000 BTU per hour (BTU/h) aggregate input.", "Consult a licensed HVAC contractor to evaluate and install a dedicated combustion air source in compliance with applicable codes and standards to ensure safe and efficient operation of the combustion appliances."], "pro": "HVAC Professional", "sev": "med", "photos": ["8.6.1_1.jpg"], "anchor": "obs-bd3491de-5c38-585f-ad15-f31b7f3d30b4", "ev": "ev/8.6.1.jpg", "craft": "hvac", "also": [], "note": ""}, {"ref": "8.7.1", "section": "Equipment Disconnects", "title": "Disconnect - Not Present", "loc": "Mechanical Room", "desc": ["Heating or Cooling equipment should have an electrical disconnect located within 6' of unit. Recommend installation of a dedicated disconnect within reach of the unit."], "pro": "HVAC Professional", "sev": "med", "photos": ["8.7.1_1.jpg"], "anchor": "obs-5cc237dd-4388-5490-8faf-1c2326c381ac", "ev": "ev/8.7.1.jpg", "craft": "elec", "also": ["hvac"], "note": ""}, {"ref": "8.8.1", "section": "Air Filter Size and Location", "title": "Filter Dirty - Replace", "loc": "Furnace", "desc": ["The HVAC system air filter was dirty at the time of inspection. HVAC filters should be changed (or cleaned if reusable) at least once every 1-3 months of operation depending on the type of filter. If a reusable filter is present, recommend cleaning at a similar frequency."], "pro": "Handyman/DIY", "sev": "low", "photos": ["8.8.1_1.jpg"], "anchor": "obs-1e764431-a8cd-5fe7-9edb-4e663ca629f1", "ev": "ev/8.8.1.jpg", "craft": "hvac", "also": [], "note": ""}, {"ref": "8.9.1", "section": "Fireplaces & Stoves", "title": "Wood Burning - Recommend Professional Cleaning And Service", "loc": "", "desc": ["To ensure safe and efficient operation, it is recommended that the fireplace or woodstove, along with its chimney or vent system, be professionally cleaned and serviced annually. Regular maintenance helps to remove creosote buildup, identify potential safety hazards, and prolong the life of the system. Consult a qualified chimney sweep or fireplace professional for routine inspections and maintenance."], "pro": "Fireplace Contractor", "sev": "med", "photos": ["8.9.1_1.jpg"], "anchor": "obs-04a92f5e-47d6-50e0-8a12-110576b1da75", "ev": "ev/8.9.1.jpg", "craft": "chimney", "also": [], "note": ""}, {"ref": "9.2.1", "section": "Foundation", "title": "Foundation Cracks - Minor", "loc": "Basement North", "desc": ["Minor cracking was noted at the foundation. This is common as concrete ages and shrinkage surface cracks are normal. Recommend sealing to prevent moisture entry and monitoring for more serious shifting/displacement."], "pro": "Foundation Contractor", "sev": "low", "photos": ["9.2.1_1.jpg"], "anchor": "obs-0f424640-26ac-52d5-b4b2-6f9d0e682d66", "ev": "ev/9.2.1.jpg", "craft": "hoa", "also": [], "note": "Foundation, likely HOA; confirm in the HOA docs."}, {"ref": "9.2.2", "section": "Foundation", "title": "Efflorescence", "loc": "Basement North", "desc": ["Efflorescence noted on foundation walls. This a white, powdery deposit that is consistent with moisture intrusion. This can compromise the soil's ability to support the home structure and/or lead to mold growth. Recommend a qualified contractor identify source or moisture and correct."], "pro": "Qualified Professional", "sev": "med", "photos": ["9.2.2_1.jpg"], "anchor": "obs-615e6ee0-c4e4-593f-873d-de49e266661c", "ev": "ev/9.2.2.jpg", "craft": "hoa", "also": [], "note": "Foundation moisture, likely HOA; confirm in the HOA docs."}, {"ref": "10.8.1", "section": "Washer", "title": "Rubber Hoses Installed", "loc": "Laundry", "desc": ["Rubber water supply hoses are currently installed to supply the washing machine with hot and cold water. Rubber hoses have an expected service life of around 10 years and are more prone to rupture than braided stainless steel. Although the hose was observed to be in working condition, installation of braided stainless steel hoses is recommended.", "The braided stainless steel encases a rubber hose and provides a burst-resistant measure. These washing machine hoses have a lower failure rate than rubber hoses when properly installed."], "pro": "Plumbing Contractor", "sev": "low", "photos": ["10.8.1_1.jpg"], "anchor": "obs-27f65586-0bc9-5584-858b-a364702a055e", "ev": "ev/10.8.1.jpg", "craft": "plumb", "also": [], "note": ""}, {"ref": "11.2.1", "section": "Smoke Alarms", "title": "Safety Recommendation - Install Additional Smoke Alarms", "loc": "Bedrooms", "desc": ["The amount of smoke alarms observed in the home is inadequate by accepted safety standards. The National Fire Alarm and Signaling Code requires as a minimum that smoke alarms be installed inside every sleeping room (even for existing homes) in addition to requiring them outside each sleeping area and on every level of the home."], "pro": "Handyman/DIY", "sev": "high", "photos": ["11.2.1_1.jpg", "11.2.1_2.jpg"], "anchor": "obs-8fa01743-1e57-5760-8705-d3057a26f3cf", "ev": "ev/11.2.1.jpg", "craft": "finish", "also": ["elec"], "note": "Electrician if the alarms are hardwired."}, {"ref": "11.3.1", "section": "Carbon Monoxide Detectors", "title": "Safety Recommendation - Install Additional CO Detectors", "loc": "2Nd Floor", "desc": ["All single-family residences that have a fuel-burning appliance, a fireplace, or an attached garage must have a carbon monoxide detector installed within 15 feet to the entrance to any bedroom or other room that is lawfully used for sleeping. It is recommended that carbon monoxide detectors be installed on each level of the home, even if a bedroom is not present."], "pro": "Handyman", "sev": "high", "photos": ["11.3.1_1.jpg"], "anchor": "obs-a5d45ab5-f248-502d-944f-677558fff19a", "ev": "ev/11.3.1.jpg", "craft": "finish", "also": ["elec"], "note": "Electrician if the alarms are hardwired."}, {"ref": "11.4.1", "section": "Doors", "title": "Sliding Door - Floor Guides/Bumpers Broken Or Missing", "loc": "Throughout 2Nd Floor", "desc": ["Sliding closet door floor guides or bumpers were damaged, missing, or improperly installed. Recommend further evaluation by a qualified professional."], "pro": "Handyman", "sev": "low", "photos": ["11.4.1_1.jpg", "11.4.1_2.jpg", "11.4.1_3.jpg"], "anchor": "obs-5611b2f5-8348-5c1d-9a82-e8512f44fbc3", "ev": "ev/11.4.1.jpg", "craft": "finish", "also": [], "note": ""}, {"ref": "11.5.1", "section": "Windows", "title": "Perimeter Caulking", "loc": "Bedrooms, Living Room", "desc": ["Caulking at the interior perimeter of one or more windows needs to be touched-up."], "pro": "Handyman/DIY", "sev": "low", "photos": ["11.5.1_1.jpg", "11.5.1_2.jpg"], "anchor": "obs-ec9d5a61-46ff-5b14-b05f-cafce5862770", "ev": "ev/11.5.1.jpg", "craft": "finish", "also": [], "note": ""}, {"ref": "11.5.2", "section": "Windows", "title": "Energy Efficiency Recommendation - Single-Pane Windows", "loc": "Basement", "desc": ["While most likely a common practice when the home was built, single-pane windows are present in the home. These windows are not designed to prevent thermal loss/gain, or prevent transmission of UV rays like many modern windows designed with an air gap. If desired, recommend evaluation for replacement to a modern, more efficient window.", "Rebates and and financial incentives may be available for this repair measure. Click here to learn more about local, utility, state and federal incentives available to homeowners."], "pro": "Window Installation Contractor", "sev": "low", "photos": ["11.5.2_1.jpg"], "anchor": "obs-5d013f89-82f6-5c1e-9cad-2e21811c5e83", "ev": "ev/11.5.2.jpg", "craft": "info", "also": [], "note": "Windows themselves are the owner’s per the HOA. Information only."}, {"ref": "11.5.3", "section": "Windows", "title": "Channel Rod - Stuck/Damaged", "loc": "Living Room", "desc": ["A window channel balance rod was stuck/missing or damaged. This can hinder the ability for the window to open and close smoothly. Recommend repair."], "pro": "Window Installation Contractor", "sev": "med", "photos": ["11.5.3_1.jpg", "11.5.3_2.jpg"], "anchor": "obs-2b467f1b-90bf-5922-b5f7-fd2ac0996033", "ev": "ev/11.5.3.jpg", "craft": "finish", "also": [], "note": ""}, {"ref": "11.6.1", "section": "Flooring", "title": "Flooring - Damaged (General) (4 more defects)", "loc": "Various Locations Throughout 1St Floor", "desc": ["The flooring had general damage visible in a specific area or in various locations throughout the home and may potentially require replacement. Recommend repair or replacement by a qualified contractor."], "pro": "Flooring Contractor", "sev": "med", "photos": ["11.6.1_1.jpg", "11.6.1_2.jpg", "11.6.1_3.jpg"], "anchor": "obs-b3c0ddad-ed9c-5ce6-8cf5-6ad2b874936b", "ev": "ev/11.6.1.jpg", "craft": "finish", "also": [], "note": ""}, {"ref": "11.6.2", "section": "Flooring", "title": "Carpet - Dirty/Stained (1 more defect)", "loc": "Various Locations Throughout Interior", "desc": ["Carpet was dirty or stained and may require cleaning or possibly replacement. Recommend evaluation by a qualified professional."], "pro": "Qualified Professional", "sev": "low", "photos": ["11.6.2_1.jpg", "11.6.2_2.jpg", "11.6.2_3.jpg"], "anchor": "obs-60604d39-bdfa-5977-aa23-ae465294efa2", "ev": "ev/11.6.2.jpg", "craft": "finish", "also": [], "note": ""}, {"ref": "11.7.1", "section": "Walls, Ceilings, & Trim", "title": "Touchup Paint (1 more defect)", "loc": "Caulking Or Minor Repair Needed, Various Locations Throughout Interior", "desc": ["Touchup paint, caulking or minor repair to wall, ceiling, trim, and or interior surfaces is needed. Recommend evaluation by a qualified professional. Recommend evaluation from a qualified professional."], "pro": "Handyman/DIY", "sev": "low", "photos": ["11.7.1_1.jpg", "11.7.1_2.jpg", "11.7.1_3.jpg"], "anchor": "obs-bef4ecd0-0387-5f5d-acf4-2897139f8ee8", "ev": "ev/11.7.1.jpg", "craft": "finish", "also": [], "note": ""}, {"ref": "11.7.2", "section": "Walls, Ceilings, & Trim", "title": "Wall/Ceiling - Minor Cracking", "loc": "Living Room", "desc": ["Minor surface cracking was observed at one or more wall or ceiling surfaces or around the corners of openings like walls and doors. This type of cracking is common especially in older homes, but can occur in newer homes as well. It usually indicates slight settling over time. Recommend monitoring for further cracking or if desired, evaluation by a qualified professional."], "pro": "Monitor", "sev": "low", "photos": ["11.7.2_1.jpg", "11.7.2_2.jpg"], "anchor": "obs-b977523d-e9b9-5184-a375-f1ff70240521", "ev": "ev/11.7.2.jpg", "craft": "finish", "also": [], "note": ""}, {"ref": "11.7.3", "section": "Walls, Ceilings, & Trim", "title": "Evidence Of Moisture - Staining - Inactive", "loc": "Staircase", "desc": ["Evidence of moisture staining was observed on one or more areas of the wall, trim or ceiling. These areas did not appear to be active during the time of inspection. This may be from a previous leak above the area defined. Recommend monitoring for further staining and consult with a qualified professional if desired."], "pro": "Monitor", "sev": "low", "photos": ["11.7.3_1.jpg", "11.7.3_2.jpg"], "anchor": "obs-12b4fb99-7f7d-51be-80d9-2d85516ec381", "ev": "ev/11.7.3.jpg", "craft": "finish", "also": [], "note": ""}, {"ref": "11.9.1", "section": "Cabinets, Counters, & Backsplashes", "title": "Counter - Cracked/Chipped/Delamination", "loc": "", "desc": ["Countertop had one or more cracks or chips, or was delaminating. Recommend evaluation by a qualified professional.", "Here is a helpful article on repairing cracks, chips & fissures."], "pro": "Countertop Contractor", "sev": "low", "photos": ["11.9.1_1.jpg", "11.9.1_2.jpg"], "anchor": "obs-31489829-019f-5c67-b788-c164d4566b38", "ev": "ev/11.9.1.jpg", "craft": "finish", "also": [], "note": ""}, {"ref": "11.9.2", "section": "Cabinets, Counters, & Backsplashes", "title": "Cabinet - Refinish Needed", "loc": "Kitchen", "desc": ["Finish on cabinets is old and worn. This not only degrades the aesthetics of the cabinets, but also reduces durability of the cabinets including the ability to resist spills. Recommend evaluation by a qualified professional."], "pro": "Cabinet Contractor", "sev": "low", "photos": ["11.9.2_1.jpg", "11.9.2_2.jpg"], "anchor": "obs-03125991-0288-5ec0-b690-2f1deafeb778", "ev": "ev/11.9.2.jpg", "craft": "finish", "also": [], "note": ""}, {"ref": "11.10.1", "section": "Bathrooms", "title": "Shower Surround Ends Below Shower Head", "loc": "Bathrooms Throughout", "desc": ["The shower surround did not extend up past the shower head. It is best practice for the surround to extend up above the fixture to protect surfaces in the event of a leak, or during use. If this is not possible due to a solid surround or other pre-manufactured shower stall, it is recommended that proper caulking and moisture-resistant paints, or tile be installed to minimize moisture impacts on surfaces. Recommend evaluation by a qualified professional for repair if desired."], "pro": "Qualified Professional", "sev": "low", "photos": ["11.10.1_1.jpg", "11.10.1_2.jpg", "11.10.1_3.jpg"], "anchor": "obs-fee07008-5c78-5365-a7ef-a8d694a9d717", "ev": "ev/11.10.1.jpg", "craft": "finish", "also": [],   if(!db){ loaded = true; st.textContent = "Prices save on this device only"; return; }
  try{
    const [ps, es] = await Promise.all([db.collection("prices").get(), db.collection("electives").get()]);
    ps.docs.forEach(d => { prices[d.id] = Object.assign({}, d.data(), prices[d.id]||{}); });
    es.docs.forEach(d => { electives[d.id] = Object.assign({}, d.data(), electives[d.id]||{}); });
    loaded = true; st.textContent = "Prices save to your account as you type";
    renderList(); renderEls();
    // push anything typed before the store answered
    Object.keys(prices).forEach(k => db.doc("prices/"+k).set(prices[k]).catch(()=>{}));
    Object.keys(electives).forEach(k => db.doc("electives/"+k).set(electives[k]).catch(()=>{}));
  }catch(err){ loaded = true; db = null; st.textContent = "Saving on this device only (" + (err.code||"store unavailable") + ")"; }
})();
</script>
</body></html>
